name: Community audio jobs

# Requests community TTS for the Mandarin lines that need it (dialogue#10, #11,
# freeappstore-online/platform#727): contributors' devices speak them with Kokoro, the platform
# verifies each upload, and the app plays the accepted ones in place of the bundled MP3s.
# Runs when the dialogue text changes on main (requesting only lines with no job yet) and by hand.
# Authenticates with this
# run's GitHub OIDC token, which the platform accepts only from main of the app's own repository.
# The first real run creates the two job sets (one per speaker), commits their ids to
# web/src/dialogue/community-sets.json, then redeploys so the app reads them.
# dry_run (manual runs only) reports what would be requested and creates nothing. Details: scripts/community-audio.py.

on:
  push:
    branches: [main]
    paths:
      - web/src/dialogue/scenarios/**
      - web/src/dialogue/repairs.json
      - web/src/dialogue/phrases.json
      - scripts/audio_lines.py
      - scripts/community-audio.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be requested; create and request nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: community-audio
  cancel-in-progress: false

jobs:
  enqueue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits community-sets.json on the first run
      actions: write    # then redeploys the app
      id-token: write   # the platform's owner credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Queue the lines
        run: python scripts/community-audio.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit new job sets and redeploy
        if: ${{ !cancelled() }}  # keep a set created before a later call failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet web/src/dialogue/community-sets.json && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -qm "chore(audio): community audio job sets (community-sets.json)" web/src/dialogue/community-sets.json
          git pull -q --rebase && git push -q
          # A push with the workflow token starts no workflow, so deploy by hand
          gh workflow run deploy.yml --ref main
